<!DOCTYPE html>
<!-- 本文件由 main/CMakeLists.txt 的 EMBED_FILES 嵌入固件，改动后需重新编译。
     本地预览（不用烧写）：先运行同目录 mock_server.py，再开 http://127.0.0.1:8000。
     JS 调 HttpConfigApi 提供的 /api/status（WiFi）与 /api/devices（USB 设备）。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>usbipdcpp 管理面板</title>
<style>
:root{
    /* 配色集中在这里（原本散在各条规则里，改主题得满文件找）。状态色按"点/字/底"
       分三层：--ok 这类用于状态点与主按钮的实心块，--ok-fg 是配浅底用的深色文字，
       --ok-bg 是浅色底 */
    --bg:#eef1f5;         /* 页面背景 */
    --surface:#fff;       /* 卡片、输入框的底 */
    --on-accent:#fff;     /* 主按钮上的文字 */
    --sunken:#f6f8fa;     /* 消息条、提示块的浅底 */
    --track:#e3e8ef;      /* 页签/分段控件的轨道 */
    --code-bg:#eceff3;    /* 命令示例的底 */
    --divider:#eef0f3;    /* 分隔线、灰色徽章的底 */
    --fg:#2b2f36;         /* 主文字 */
    --fg-mid:#5a6470;     /* 次级文字：标签、状态条 */
    --fg-muted:#8a9199;   /* 弱化文字：说明、表头 */
    --fg-faint:#9aa3ad;   /* 最弱：空状态、页脚 */
    --border:#d5dae1;     /* 输入框边框、状态条分隔点 */
    --accent:#5b7cfa;     /* 链接、次级按钮 */
    --off:#c3c9d1;        /* 未知/离线状态的灰点 */
    --ok:#2f9e63;
    --ok-fg:#1e7d4e;
    --ok-bg:#eaf7f0;      /* 成功消息条的底 */
    --ok-bg-soft:#e6f6ee; /* 成功徽章的底：与上一条几乎同色，保留原值不动既有观感 */
    --err:#d64545;
    --err-fg:#a5281f;
    --err-bg:#fdecea;
    --warn:#b26a00;
    --warn-fg:#8a5000;
    --warn-bg:#fdf1e3;
}
body{font-family:'Microsoft YaHei','Segoe UI',sans-serif;background:var(--bg);margin:0;color:var(--fg)}
a{color:var(--accent)}
.wrap{max-width:520px;margin:0 auto;padding:24px 16px}
.card{background:var(--surface);border-radius:12px;padding:22px 24px;box-shadow:0 4px 16px rgba(40,60,90,.15);margin-bottom:20px}
.card h2{margin:0 0 4px;font-size:19px;display:flex;align-items:center;justify-content:space-between}
.sub{color:var(--fg-muted);font-size:13px;margin:0 0 16px;line-height:1.6}
#dot{width:10px;height:10px;border-radius:50%;background:var(--off);flex:none}
/* 状态点的三种颜色（renderStatus 按连接状态切 class）：未连接但热点在跑 =
   用户正在配网，用橙色跟故障的红区分开 */
#dot.on{background:var(--ok)}
#dot.warn{background:var(--warn)}
#dot.err{background:var(--err)}
label{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--fg-mid);margin-bottom:6px}
/* label 右侧的"当前值"小字：要改的东西和它现在的状态放同一行，不必上下对照两块 */
.lblnote{color:var(--fg-muted);font-size:12px}
.mt{margin-top:14px}
/* "无密码"勾选行：勾上后密码框禁用（两个控件说同一件事，见 toggleOpenNet）；
   复选框要压回全局 input 的 width:100%，否则会被拉成一整行 */
.checkline{display:flex;justify-content:flex-start;gap:8px;align-items:center;margin:10px 0 0;font-size:13px;color:var(--fg-mid);cursor:pointer}
.checkline input{width:auto;padding:0;margin:0;flex:none}
input,select{box-sizing:border-box;width:100%;padding:10px 12px;font-size:14px;border:1px solid var(--border);border-radius:8px;outline:none;background:var(--surface);color:var(--fg)}
/* 禁用态（勾"无密码"后的密码框）：上面自定义的 background 盖掉了浏览器默认的
   灰底，显式压暗，让"这个框现在不用填"看得出来 */
input:disabled{opacity:.55}
button{width:100%;margin-top:20px;padding:11px;font-size:15px;color:var(--on-accent);background:var(--ok);border:0;border-radius:8px;cursor:pointer}
button.mini{width:auto;margin:0;padding:4px 12px;font-size:12px;border-radius:6px;background:var(--accent)}
/* 语言切换：状态条右端的描边小按钮，不跟主操作抢视线 */
.langbtn{width:auto;margin:0;padding:2px 9px;font-size:12px;line-height:1.7;
    color:var(--fg-muted);background:transparent;border:1px solid var(--border);border-radius:8px}
.langbtn:hover{color:var(--accent);border-color:var(--accent)}
/* 设备号/IP/SSID 这类逐字符读的内容用等宽，0 和 O、1 和 l 不容易看混 */
.mono{font-family:Consolas,Menlo,monospace}

/* 顶部状态条：连接状态、SSID、IP、热点一句话看全，不必进各页面找 */
.statusbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;
    background:var(--surface);border-radius:12px;padding:13px 18px;margin-bottom:12px;
    box-shadow:0 4px 16px rgba(40,60,90,.15);font-size:13px;color:var(--fg-mid)}
.statusbar .sep{color:var(--border)}
/* 当前工作模式：这个信息本来只在 WiFi 页里能看到，状态条给一个始终在场的标记。
   AP 用警示色——它意味着设备这会儿不连 WiFi，跟"配网中"是同一处境 */
.statusbar .tag{padding:2px 8px;border-radius:8px;background:var(--track);color:var(--fg-mid);font-size:12px}
.statusbar .tag.ap{background:var(--warn-bg);color:var(--warn)}
/* SSID 和 IP 各占一行：flex-basis:100% 让它们各自独占整行（其后的元素被挤到
   下一行），min-width:0 允许压到比自身内容窄，超长时省略号才会生效 */
.statusbar #ssid_val,.statusbar #ip_val{flex-basis:100%;min-width:0}
.statusbar .ellipsis{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.statusbar .spacer{flex:1}
/* 拉不到状态时整条变淡：显示的还是上一次的值，别让它看着像实时数据 */
.statusbar.offline{opacity:.55}

/* 分段控件（页签 / 工作模式二选一）：一次只显示或只选中一块 */
.tabs{display:flex;gap:4px;background:var(--track);border-radius:10px;padding:4px;margin-bottom:16px}
.segmented{display:flex;gap:4px;background:var(--track);border-radius:10px;padding:4px}
.tabs button,.segmented button{flex:1;width:auto;margin:0;padding:9px 0;font-size:14px;color:var(--fg-mid);
    background:transparent;border:0;border-radius:7px;cursor:pointer}
.tabs button.active,.segmented button.active{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(40,60,90,.14)}
.segmented button{font-size:13px}
.segmented button:disabled{opacity:.55;cursor:default}
.panel[hidden]{display:none}

/* 消息条：成功/失败两种配色，左侧色条 + 底色让结果一眼可辨；
   pre-line 让文案里的 \n 生效，first-line 把首行加粗当标题用 */
.msg{display:none;margin:14px 0 0;padding:10px 12px;border-radius:8px;
    border-left:3px solid var(--off);background:var(--sunken);color:var(--fg-mid);
    font-size:13px;line-height:1.7;white-space:pre-line}
.msg::first-line{font-weight:600}
.msg.ok{background:var(--ok-bg);border-left-color:var(--ok);color:var(--ok-fg)}
.msg.err{background:var(--err-bg);border-left-color:var(--err);color:var(--err-fg)}
/* 串口救急提示：平时不用看，折叠起来；接线信息来自 /api/status */
.hint-details{margin-top:16px}
.hint-details>summary{cursor:pointer;color:var(--accent);font-size:13px;list-style:none}
.hint-details>summary::-webkit-details-marker{display:none}
.hint-details>summary::after{content:' ▾'}
.hint-details[open]>summary::after{content:' ▴'}
.hint{margin-top:10px;padding:12px 14px;border-radius:8px;background:var(--sunken);font-size:13px;color:var(--fg-mid);line-height:1.9}
.hint-title{color:var(--fg);font-weight:600}
.hint-cmd{margin:8px 0;padding:6px 10px;border-radius:6px;background:var(--code-bg);
    font-family:Consolas,Menlo,monospace;font-size:12.5px;color:var(--fg)}
.hint-note{color:var(--fg-muted);font-size:12px;line-height:1.7}
.hint-row{margin-top:6px}
.hint-row b{font-family:Consolas,Menlo,monospace;color:var(--fg)}
/* 配网模式横幅：用户此时连着设备自己的热点，页面第一眼要告诉他下一步做什么 */
.banner{background:var(--warn-bg);border-left:3px solid var(--warn);color:var(--warn-fg);border-radius:8px;
    padding:12px 14px;margin-bottom:12px;font-size:13px;line-height:1.8}
.banner b{font-family:Consolas,Menlo,monospace}
.devbox{min-height:60px;font-size:14px}
.none{color:var(--fg-faint);text-align:center;padding:20px 0}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--divider);font-size:14px}
th{color:var(--fg-muted);font-size:13px;font-weight:normal}
/* 末列（占用状态）靠右：表格通栏时两端的对齐撑住，不至于挤在左边一小撮 */
th:last-child,td:last-child{text-align:right}
.badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:12px}
.badge.idle{background:var(--ok-bg-soft);color:var(--ok-fg)}
.badge.busy{background:var(--warn-bg);color:var(--warn)}
.badge.off{background:var(--divider);color:var(--fg-muted)}
.foot{text-align:center;color:var(--fg-faint);font-size:12px;margin-top:4px}

/* 桌面宽屏：屏幕够宽就不必靠页签分屏，设备表和网络设置从上往下排开即可
   （面板间距由 .card 自己的 margin-bottom 给，不需要额外的栅格间距） */
@media (min-width:880px){
    .wrap{max-width:880px}
    .tabs{display:none}
    .panel[hidden]{display:block}
    .foot{margin-top:20px}
}
</style>
</head>
<body>
<div class="wrap">
  <!-- 配网模式提示：用户连的就是设备自己的热点（见 renderProvisioningAp：
      进入配网模式时连带自动切到 WiFi 页，让他直接能填）。
      不写"连不上 WiFi"——AP 工作模式下热点是配置出来的，不是连不上 -->
  <div id="apbanner" class="banner" style="display:none">
    <!-- 首尾两段分开标记：SSID 是设备下发的动态内容，只能走 textContent 填，
         不能拼进文案模板里（那就是 innerHTML 注入了） -->
    <span data-i18n="banner_pre"></span><b id="banner_ssid"></b><span data-i18n="banner_post"></span>
  </div>

  <!-- 状态条：所有状态一眼看全。SSID 和 IP 各占一行——两者长度都不固定，
       挤在同一行时 SSID 会被两侧元素夹着，再长的名字也得截断 -->
  <div class="statusbar" id="statusbar">
    <span id="dot"></span>
    <span id="st_val"></span>
    <span id="mode_tag" class="tag">—</span>
    <span class="spacer"></span>
    <span id="ap_sum" class="badge idle" style="display:none"></span>
    <button type="button" id="langbtn" class="langbtn" data-i18n="lang_btn" onclick="toggleLang()"></button>
    <span id="ssid_val" class="ellipsis">—</span>
    <span id="ip_val" class="mono">—</span>
  </div>

  <nav class="tabs">
    <button type="button" class="active" data-tab="devices" data-i18n="tab_devices" onclick="selectTab('devices')"></button>
    <button type="button" data-tab="net" data-i18n="tab_net" onclick="selectTab('net')"></button>
  </nav>

  <!-- 宽屏下这一层切成两列（见样式表末尾的媒体查询）：屏幕够宽就整块排开，
       不靠页签分屏 -->
  <div class="panels">

  <section id="tab-devices" class="panel card">
    <h2><span data-i18n="devices_title"></span><button class="mini" type="button" data-i18n="refresh" onclick="refreshAll()"></button></h2>
    <p class="sub" data-i18n="devices_sub"></p>
    <div id="devbox" class="devbox"></div>
    <!-- 拿到设备列表后下一步就是去电脑上 attach，但命令不在这个页面上时
         用户得翻 README——那是最容易卡住的一步，直接放这里 -->
    <details class="hint-details">
      <summary data-i18n="devices_how"></summary>
      <div class="hint">
        <div class="hint-title" data-i18n="linux_client"></div>
        <div class="hint-cmd">sudo modprobe vhci-hcd</div>
        <div class="hint-cmd" data-i18n="attach_cmd"></div>
        <div class="hint-note"><span data-i18n="hint_note_pre"></span><a
          href="https://github.com/yunsmall/usbipdcpp_esp32" target="_blank" rel="noopener"
          data-i18n="project_home"></a></div>
      </div>
    </details>
  </section>

  <section id="tab-net" class="panel card" hidden>
    <h2 data-i18n="net_title"></h2>
    <p class="sub" data-i18n="net_sub"></p>

    <!-- 连不连 WiFi 跟名称/密码是同一件事的两半，一起在点保存时才生效：
         拆成"点了就切的模式按钮 + 另一个保存按钮"时，同一个面板里两套生效
         时机，用户得先分清哪个会当场断网（见 saveNet） -->
    <label data-i18n="connect_label"></label>
    <div class="segmented">
      <button type="button" id="conn_yes" data-i18n="conn_yes" onclick="pickConnect(true)"></button>
      <button type="button" id="conn_no" data-i18n="conn_no" onclick="pickConnect(false)"></button>
    </div>
    <p class="sub" id="conn_hint" style="margin:8px 0 0"></p>

    <!-- 要连的那个 WiFi 的凭据：选"不连接"时整块换成说明（见 renderNetPage）——
         设备都不连 WiFi 了，还摆着名称/密码两个框只会让人以为要填两遍 -->
    <div id="wifi_cred">
      <label for="ssid" class="mt" data-i18n="ssid_label"></label>
      <input id="ssid" data-i18n-ph="ssid_ph" spellcheck="false" oninput="ssid_dirty = true">
      <label for="password" class="mt"><span data-i18n="pass_label"></span><span class="lblnote" id="wifi_auth_note">—</span></label>
      <input id="password" type="password" data-i18n-ph="pass_ph">
      <!-- "留空"猜不出是"不改密码"还是"要改成开放"：把后者做成显式勾选（见 saveNet）。
     有意不按当前配置预勾选：复选框只表达目标，保持开放也得是显式动作（与"空密码不再有
     静默含义"同一原则）；当前配置有没有密码由密码栏旁的小字单独显示（wifi_auth） -->
      <label class="checkline"><input type="checkbox" id="open_net" onchange="toggleOpenNet()"><span data-i18n="open_net_label"></span></label>
    </div>
    <p class="sub" id="ap_mode_note" style="display:none" data-i18n="ap_mode_note"></p>
    <button id="savebtn" data-i18n="net_save" onclick="saveNet()"></button>
    <p id="msg" class="msg"></p>

    <!-- 配网热点：设备连不上 WiFi 时自动开启的兜底通道，平时不用管，所以收进
         折叠区；但名称/密码得能改——用户正是要连上它才能进来配网。
         修改入口和当前值放同一处：名称框预填现状（见 renderProvisioningAp），
         密码固件不下发，只能靠 label 右侧的小字说明现状 -->
    <details class="hint-details">
      <summary data-i18n="ap_summary"></summary>
      <div class="hint">
        <div data-i18n="ap_hint"></div>
        <label for="ap_ssid" class="mt" data-i18n="ap_ssid_label"></label>
        <input id="ap_ssid" data-i18n-ph="ap_ssid_ph" spellcheck="false" oninput="ap_ssid_dirty = true">
        <label for="ap_pass" class="mt"><span data-i18n="ap_pass_label"></span><span class="lblnote" id="ap_auth_note">—</span></label>
        <input id="ap_pass" type="password" data-i18n-ph="ap_pass_ph">
        <button id="apbtn" data-i18n="ap_save" onclick="saveAp()"></button>
        <p id="apmsg" class="msg"></p>
      </div>
    </details>

    <!-- 救急路径：本页只能联网访问，配错 WiFi 断网时按此接线走串口重配。
         启用/未启用两种状态整块切换（见 renderStatus） -->
    <details class="hint-details">
      <summary data-i18n="serial_summary"></summary>
      <div class="hint" id="hint_serial">
        <div class="hint-title" data-i18n="serial_title"></div>
        <div data-i18n="serial_intro"></div>
        <div class="hint-cmd">wifi_set MyAP 12345678</div>
        <div class="hint-note" data-i18n="serial_note"></div>
        <div class="hint-row"><span data-i18n="serial_tx"></span> <b>GPIO<span id="cfg_tx"></span></b></div>
        <div class="hint-row"><span data-i18n="serial_rx"></span> <b>GPIO<span id="cfg_rx"></span></b></div>
      </div>
      <div class="hint" id="hint_noserial" style="display:none">
        <div class="hint-title" data-i18n="serial_unavailable_title"></div>
        <div data-i18n="serial_unavailable"></div>
      </div>
    </details>
  </section>

  </div>

  <p class="foot"><span data-i18n="foot_pre"></span><a
    href="https://github.com/yunsmall/usbipdcpp_esp32" target="_blank" rel="noopener"
    data-i18n="foot_link"></a></p>
</div>

<script>
// ---- 中英双语 ----
// 文案只有这一份真相源：固件的错误响应只回机器可读的 code（见 HttpConfigApi.cpp
// 各处的 send_json），由这里翻成当前语言。页面上的静态标签走 data-i18n /
// data-i18n-ph（applyI18n 填），JS 里动态拼的文字走 t()。
// 语言默认跟随浏览器，用户手动切过就记在 localStorage 里，下次直接用它
const I18N = {
    zh: {
        title: 'usbipdcpp 管理面板',
        lang_btn: 'EN',            // 按钮上写的是"切过去之后"的语言
        // 状态条
        status_reading: '状态读取中…',
        connected: '已连接',
        not_connected_ap: '未连接（配网中）',
        not_connected: '未连接',
        no_device_status: '无法连接设备',
        ssid_unset: '（未配置）',
        ap_running: '配网热点运行中',
        banner_pre: '设备已开启配网热点 ',
        banner_post: '。在下面填好 WiFi 名称和密码并保存，连上后此热点会自动关闭。',
        // 页签
        tab_devices: 'USB 设备',
        tab_net: '网络',
        // 设备页
        devices_title: 'USB 设备',
        refresh: '刷新',
        devices_sub: '插在 ESP32 USB Host 口上的设备，可通过 USB/IP 网络共享给电脑',
        devices_how: '在电脑上怎么用这些设备？',
        linux_client: 'Linux 客户端',
        attach_cmd: 'sudo usbip attach -r <设备IP> -b <busid>',
        hint_note_pre: 'busid 就是上表里的 1-1 这种。Windows 用 usbip-win2 图形客户端，服务器填设备 IP、端口 3240。完整步骤见 ',
        project_home: '项目主页',
        devices_error: '无法获取设备列表',
        devices_empty: '未检测到 USB 设备',
        dtable_busid: 'busid',
        dtable_vidpid: 'VID:PID',
        dtable_status: '状态',
        in_use: '使用中',
        free: '空闲',
        // 网络页
        net_title: '网络',
        net_sub: '设备连上 WiFi 后就能在局域网上用它；连不上时自动开一个配网热点兜底',
        connect_label: '设备要连的 WiFi',
        conn_yes: '连接 WiFi',
        conn_no: '不连接，只开热点',
        conn_hint_yes: '连不上时设备会自动开一个配网热点，让你连回来改设置（见下方）',
        conn_hint_no: '设备不连接任何 WiFi，只开自己的配网热点',
        // 状态条上的模式标记：短到一眼扫过，完整措辞在网络页的选择说明里
        tag_sta: 'STA 模式',
        tag_ap: 'AP 模式',

const lang_saved = localStorage.getItem('lang');
let lang = (lang_saved === 'zh' || lang_saved === 'en') ? lang_saved
    : ((navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en');

// {0}、{1} 是占位符。插进来的都是动态内容（SSID 之类），只做字符串替换，
// 绝不拼进 innerHTML——那等于把设备下发的数据当代码执行
function t(key, ...args) {
    const dict = I18N[lang] || I18N.zh;
    const s = dict[key] !== undefined ? dict[key]
        : (I18N.zh[key] !== undefined ? I18N.zh[key] : key);
    return args.reduce((acc, v, i) => acc.split('{' + i + '}').join(v), s);
}

// 固件错误：按 code 出本地化文案；遇到本前端不认识的 code（固件加了新分支，
// 而页面还没跟上）就把 code 原样带出来，报 bug 时一眼能看出是哪个分支
function tErr(code) {
    if (!code) return t('unknown_error');
    const key = 'err_' + code;
    return (I18N[lang] && I18N[lang][key] !== undefined) ? t(key) : t('unknown_code', code);
}

// 把当前语言铺到页面上：静态标签、输入框占位、页面标题、<html lang>（影响
// 浏览器断行规则和读屏发音）
function applyI18n() {
    document.title = t('title');
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
    for (const el of document.querySelectorAll('[data-i18n-ph]')) el.placeholder = t(el.dataset.i18nPh);
}

function toggleLang() {
    lang = lang === 'zh' ? 'en' : 'zh';
    localStorage.setItem('lang', lang);
    applyI18n();
    // 页面上已有的消息条是上一刻、上一语言的结论，直接清掉免得中英混排；
    // 其余动态文字（状态条、设备表、网络页）交给紧接着的 refreshAll 重画
    for (const id of ['msg', 'apmsg']) {
        document.getElementById(id).style.display = 'none';
    }
    refreshAll();
}

applyI18n();
// 状态条第一格平时显示动态状态（不走 data-i18n），首个 /api/status 回来前先占位
document.getElementById('st_val').textContent = t('status_reading');

// 一次只显示一个面板：窄屏上三块内容堆成一列要一直翻，分页后每块一屏。
// 宽屏（≥880px）下样式表强制三块全显示、这里的 hidden 不生效；页签高亮和
// hidden 都在本函数里设置、永远同源，所以窗口宽度来回变化也不会出现
// "高亮的面板和显示的内容对不上"
function selectTab(name) {
    for (const btn of document.querySelectorAll('.tabs button')) {
        btn.classList.toggle('active', btn.dataset.tab === name);
    }
    for (const panel of document.querySelectorAll('.panel')) {
        panel.hidden = panel.id !== 'tab-' + name;
    }
}

// kind：'ok' 成功（绿）/ 'err' 失败（红）/ 省略 = 中性（灰：进行中或信息提示）
function setMsgOn(id, text, kind) {
    const m = document.getElementById(id);
    // 配色与左侧色条走 .ok / .err（见样式表），这里只切类名
    m.className = 'msg' + (kind ? ' ' + kind : '');
    m.style.display = 'block';
    m.textContent = text;
}
function setMsg(text, kind) { setMsgOn('msg', text, kind); }
function setApMsg(text, kind) { setMsgOn('apmsg', text, kind); }

// 配网模式的边沿标记：只在"进入配网模式"那一次自动切到网络页，
// 用户切走之后轮询不再抢（见 renderProvisioningAp）
let ap_was_active = false;

// 热点名称框被用户改过：改过就不再用轮询值覆盖，免得输入到一半被冲掉
let ap_ssid_dirty = false;

// 要连的 WiFi 名称框同理：预填当前值，但用户改过就不再覆盖
let ssid_dirty = false;

// 配网热点的固定地址：页面别处（热点说明、状态条）都引这个值
const AP_ADDR = '192.168.4.1';

// 连接选择（连 / 不连 WiFi）与凭据同属一个表单，点保存才一起生效：
// want_connect 是界面上选中的，cur_connect 是固件当前实际状态，
// connect_dirty 标记用户动过——轮询就不再覆盖他的选择（见 renderNetPage / saveNet）
let want_connect = true;
let cur_connect = true;
let connect_dirty = false;
let cur_ssid = '';

// 配网热点相关的界面全部在这里更新：横幅、状态条徽章、热点页。单独成函数是
// 因为它同时管好几处 DOM，散在轮询主流程里改一处容易看漏另一处
function renderProvisioningAp(j) {
    const ap_active = !!j.ap_active;
    // 横幅说明当前处境；进入配网模式的那一次自动切到 WiFi 页（用户连上热点
    // 打开本页就是为了填 WiFi，让他直接能填）
    document.getElementById('apbanner').style.display = ap_active ? '' : 'none';
    if (ap_active) {
        document.getElementById('banner_ssid').textContent = j.ap_ssid || '';
        if (!ap_was_active) selectTab('net');
    }
    ap_was_active = ap_active;

    // 状态条上的徽章只在热点真运行时出现，平时不占视线
    const ap_sum = document.getElementById('ap_sum');
    ap_sum.style.display = ap_active ? '' : 'none';
    // 徽章只管热点状态：是 AP 还是 STA 由状态条上的模式标记说，别在这儿重复一遍
    ap_sum.textContent = t('ap_running');

    // 名称框预填当前值，用户不用照着别处抄
    if (!ap_ssid_dirty) document.getElementById('ap_ssid').value = j.ap_ssid || '';
    // 密码固件不下发（只回有没有），只能在 label 右侧说明现状——改名字时
    // 很容易把密码框留空，那就把热点改成开放的了，先让用户看见
    document.getElementById('ap_auth_note').textContent =
        t(j.ap_auth ? 'ap_auth_set' : 'ap_auth_none');
}

// 点"连 / 不连"只是改本地选择，跟改名称密码一样要点保存才生效（见 saveNet）
function pickConnect(yes) {
    want_connect = yes;
    connect_dirty = true;
    renderConnectChoice();
}

// 勾了"无密码"就禁用密码框：两个控件说的是同一个目标（目标密码取什么），
// 同时可编辑只会互相打架
function toggleOpenNet() {
    document.getElementById('password').disabled =
        document.getElementById('open_net').checked;
}

// 选择控件和它牵动的显隐：凭据框只在"连接"时出现，选"不连接"换成一句说明
function renderConnectChoice() {
    document.getElementById('conn_yes').classList.toggle('active', want_connect);
    document.getElementById('conn_no').classList.toggle('active', !want_connect);
    document.getElementById('conn_hint').textContent = t(want_connect ? 'conn_hint_yes' : 'conn_hint_no');
    document.getElementById('wifi_cred').style.display = want_connect ? '' : 'none';
    document.getElementById('ap_mode_note').style.display = want_connect ? 'none' : '';
    // 按钮文案跟着选择走：选"不连接"时还写"保存并连接"就自相矛盾了。
    // 按钮上留着 data-i18n 是为了首屏和切语言时有个正确的兜底文案
    document.getElementById('savebtn').textContent = t(want_connect ? 'net_save' : 'net_save_noconn');
}

// 把固件状态同步进网络页：用户没动过的字段才跟随刷新——动过的等他提交，
// 否则填到一半就被轮询冲掉
function renderNetPage(j) {
    const is_ap = j.work_mode === 'ap';
    cur_connect = !is_ap;
    if (!connect_dirty) want_connect = cur_connect;
    renderConnectChoice();

    // 状态条上也标一个：这个信息别处看不到，得进网络页才知道
    const tag = document.getElementById('mode_tag');
    tag.textContent = t(is_ap ? 'tag_ap' : 'tag_sta');
    tag.classList.toggle('ap', is_ap);

    // 名称框预填当前值（同热点名称框）：改密码时不用把 SSID 重抄一遍
    if (!ssid_dirty) document.getElementById('ssid').value = j.ssid || '';
    cur_ssid = j.ssid || '';
    // 密码栏旁的现状小字（同热点区做法）：固件只报"有没有密码"不下发密码本身
    document.getElementById('wifi_auth_note').textContent =
        t(j.wifi_auth ? 'ap_auth_set' : 'ap_auth_none');
}

function renderStatus(j) {
    // 未连接但热点在跑 = 用户正在配网，是正常状态；用橙色跟故障的红区分开
    // （三种颜色定义在 CSS 的 #dot.on/.warn/.err 里）
    document.getElementById('dot').className =
        j.connected ? 'on' : (j.ap_active ? 'warn' : 'err');
    document.getElementById('st_val').textContent =
        t(j.connected ? 'connected' : (j.ap_active ? 'not_connected_ap' : 'not_connected'));
    // SSID/IP 显示"此刻真正能用的入口"：连着 WiFi 就是连的哪条、IP 多少；
    // 只开热点时，配置里存的那个 WiFi 名并没连上，摆着只会让人以为连着，
    // 换成热点名和热点地址——那才是此刻能连上设备的东西
    let shown_name = j.ssid, shown_ip = j.ip;
    if (!j.connected && j.ap_active) {
        shown_name = j.ap_ssid;
        shown_ip = AP_ADDR;
    }
    document.getElementById('ssid_val').textContent = shown_name || t('ssid_unset');
    // 悬停仍给全名：SSID 独占一行后基本不会截断，但极窄屏下仍可能被压
    document.getElementById('ssid_val').title = shown_name || '';
    document.getElementById('ip_val').textContent = shown_ip || '—';
    renderProvisioningAp(j);
    renderNetPage(j);
    // 配置口 GPIO（-1 = 该功能编译期未启用）：两种状态整块切换，
    // 未启用时展示说明块而非残缺的接线行
    const console_ok = j.console_tx >= 0 && j.console_rx >= 0;
    document.getElementById('hint_serial').style.display = console_ok ? '' : 'none';
    document.getElementById('hint_noserial').style.display = console_ok ? 'none' : '';
    if (console_ok) {
        document.getElementById('cfg_tx').textContent = j.console_tx;
        document.getElementById('cfg_rx').textContent = j.console_rx;
    }
}

async function refreshWifi() {
    const bar = document.getElementById('statusbar');
    try {
        renderStatus(await (await fetch('/api/status')).json());
        bar.classList.remove('offline');
    } catch (e) {
        // 状态点一并复位：连不上设备时不能还留着上一次的绿点（回到基础样式的灰点）
        document.getElementById('dot').className = '';
        document.getElementById('st_val').textContent = t('no_device_status');
        // 整条变淡：拉不到状态时 SSID/IP 只会停在上一次的值，别让它们看着像实时的
        bar.classList.add('offline');
    }
}

async function refreshDevices() {
    const box = document.getElementById('devbox');
    let list;
    try {
        list = (await (await fetch('/api/devices')).json()).devices || [];
    } catch (e) {
        box.textContent = '';
        const none = document.createElement('div');
        none.className = 'none';
        none.textContent = t('devices_error');
        box.appendChild(none);
        return;
    }
    box.textContent = '';
    if (!list.length) {
        const none = document.createElement('div');
        none.className = 'none';
        none.textContent = t('devices_empty');
        box.appendChild(none);
        return;
    }
    const table = document.createElement('table');
    const head = document.createElement('tr');
    // 循环变量别叫 t：那是翻译函数
    for (const key of ['dtable_busid', 'dtable_vidpid', 'dtable_status']) {
        const th = document.createElement('th');
        th.textContent = t(key);
        head.appendChild(th);
    }
    table.appendChild(head);
    for (const d of list) {
        const tr = document.createElement('tr');
        const c1 = document.createElement('td');
        c1.textContent = d.busid;
        c1.className = 'mono';
        const c2 = document.createElement('td');
        c2.textContent = d.vid + ':' + d.pid;
        c2.className = 'mono';
        const c3 = document.createElement('td');
        const b = document.createElement('span');
        b.className = 'badge ' + (d.in_use ? 'busy' : 'idle');
        b.textContent = t(d.in_use ? 'in_use' : 'free');
        c3.appendChild(b);
        tr.append(c1, c2, c3);
        table.appendChild(tr);
    }
    box.appendChild(table);
}

// 保存网络设置：连接选择 + 凭据一起提交。两件事都可能断开当前 WiFi
// （本页多半正跑在这条 WiFi 上），所以动手前先弹确认，把后果说清楚
async function saveNet() {
    const ssid = document.getElementById('ssid').value.trim();
    // 勾了"无密码"就按空密码提交（此时密码框已禁用，里面残留的只是没提交的草稿）
    const want_open = document.getElementById('open_net').checked;
    const pass = want_open ? '' : document.getElementById('password').value;

    // 先判"有没有改动"再校验：什么都没动时直说，别拿校验提示烦人
    const mode_changed = want_connect !== cur_connect;
    const cred_changed = want_connect && (ssid !== cur_ssid || want_open || pass !== '');
    if (!mode_changed && !cred_changed) {
        setMsg(t('net_no_change'), 'err');
        return;
    }

    // 只在"连接"且这次真会提交凭据时校验：只切模式（如从热点模式切回连接，
    // 沿用已存的 SSID/密码自动重连）时凭据框根本不参与提交，不该拦人
    if (want_connect && cred_changed) {
        if (!ssid) {
            setMsg(t('err_ssid_required'), 'err');
            return;
        }
        // 空密码必须显式勾选"无密码"：不再有"留空 = 开放"的静默含义，否则
        // 改 SSID 时漏填密码会把新网稀里糊涂配成开放
        if (!want_open && pass === '') {
            setMsg(t('err_pass_or_open'), 'err');
            return;
        }
        // 按 UTF-8 字节算（同 saveAp）：固件与 WPA2 校验的都是字节长度
        if (pass && new TextEncoder().encode(pass).length < 8) {
            setMsg(t('err_password_too_short'), 'err');
            return;
        }
    }

    // 只切模式（不提交凭据）时没有新 SSID 可报，单独一条文案：拿 confirm_save
    // 去填会显示成"去连「」"
    const confirm_key = !want_connect ? 'confirm_disconnect'
                                      : (cred_changed ? 'confirm_save' : 'confirm_reconnect');
    if (!confirm(t(confirm_key, ssid))) return;

    // 固件要等实连结果（最长 15 秒）才应答，期间禁用按钮防重复提交
    const btn = document.getElementById('savebtn');
    btn.disabled = true;
    setMsg(t('connecting'));

    // 两个请求可能前后脚排在固件的同一个配置队列里，超时都要给够；
    // 老浏览器没有 AbortSignal.timeout 就不设，一直等固件应答
    const reqOpts = (body) => ({
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: body,
        signal: typeof AbortSignal.timeout === 'function' ? AbortSignal.timeout(20000) : undefined
    });

    let j;
    // /api/mode 是否已提交成功：随后的 /api/wifi 失败时，提示必须带上"模式已生效"，
    // 不能整体报失败（见下面的 else if）
    let mode_done = false;
    try {
        // 先切模式：它决定设备连不连 WiFi，凭据只在"连接"模式下才有意义
        if (mode_changed) {
            j = await (await fetch('/api/mode', reqOpts('mode=' + (want_connect ? 'sta' : 'ap')))).json();
            if (!(j && j.ok)) {
                setMsg(t('save_failed', tErr(j && j.code)), 'err');
                btn.disabled = false;
                refreshWifi();
                return;
            }
            mode_done = true;
        }
        if (cred_changed) {
            j = await (await fetch('/api/wifi', reqOpts(
                'ssid=' + encodeURIComponent(ssid) + '&password=' + encodeURIComponent(pass)))).json();
        }
    } catch (e) {
        // 换到别的 AP 后本机 IP 变化，响应送不到旧连接属正常；配置是否已保存
        // 取决于固件侧的连接结果，用新 IP 打开本页即可看到
        setMsg(t('switched_network'));
        btn.disabled = false;
        refreshWifi();
        return;
    }
    btn.disabled = false;
    if (j && j.ok) {
        if (want_connect && cred_changed) {
            // 凭据真提交过且成功 = 设备已连上新 WiFi
            if (j.persisted === false) {
                // 连上了但 NVS 写失败（设备存储异常）：如实说"重启后会回退"，
                // 别用 save_ok 把"已保存"报出去
                setMsg(t('save_ok_no_persist'), 'ok');
            } else {
                setMsg(t('save_ok') + (j.ip ? '\nIP: ' + j.ip : ''), 'ok');
            }
            // 提交过的凭据草稿归位：密码框不留明文（框本就不预填，留着会被
            // 当成"已保存的密码"）；"无密码"勾选也撤销，免得下次设带密码的
            // 网络时看到密码框还是禁用的一头雾水
            document.getElementById('password').value = '';
            const open_chk = document.getElementById('open_net');
            if (open_chk.checked) {
                open_chk.checked = false;
                toggleOpenNet();
            }
            ssid_dirty = false;
        } else {
            // 只切了模式：模式切换已生效 ≠ WiFi 已连上，别报"连接成功"。
            // 名称框里是用户没提交的草稿，脏标记保持——上面清掉的话轮询
            // 会把它覆盖回设备当前值，切回来时草稿就没了
            setMsg(t(want_connect ? 'mode_saved_sta' : 'mode_saved_ap'), 'ok');
        }
        // 提交成功，选择不再是"未提交"状态，交回给轮询同步
        connect_dirty = false;
    } else if (mode_done) {
        // 模式已切成功、凭据提交失败：措辞带上"模式已生效"，整体报失败会与
        // 设备当前状态不符
        setMsg(t('mode_switched_wifi_failed', tErr(j && j.code)), 'err');
    } else {
        setMsg(t('save_failed', tErr(j && j.code)), 'err');
    }
    refreshWifi();
}

async function saveAp() {
    const ssid = document.getElementById('ap_ssid').value.trim();
    if (!ssid) {
        setApMsg(t('err_ap_ssid_required'), 'err');
        return;
    }
    const pass = document.getElementById('ap_pass').value;
    // 按 UTF-8 字节数算：固件和 WPA2 校验的都是字节长度，按字符数算会把
    // 中文密码误拦（4 个汉字就是 12 字节）
    if (pass && new TextEncoder().encode(pass).length < 8) {
        // 固件端也会拒（WPA2 下限 8 位），先拦一道省一次往返
        setApMsg(t('err_ap_pass_short'), 'err');
        return;
    }
    const btn = document.getElementById('apbtn');
    btn.disabled = true;
    const opts = {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: 'ssid=' + encodeURIComponent(ssid) + '&password=' + encodeURIComponent(pass)
    };
    // 超时给到 20 秒：固件的配置操作是串行的，本请求可能排在"保存并重连"
    // （最长等 15 秒连接结果）后面才执行
    if (typeof AbortSignal.timeout === 'function') {
        opts.signal = AbortSignal.timeout(20000);
    }
    let j;
    try {
        j = await (await fetch('/api/ap', opts)).json();
    } catch (e) {
        setApMsg(t('ap_no_response'), 'err');
        btn.disabled = false;
        return;
    }
    btn.disabled = false;
    if (j && j.ok) {
        // 固件已接受这个值，重新交给轮询同步（见 renderProvisioningAp）
        ap_ssid_dirty = false;
        setApMsg(t('ap_saved', ssid), 'ok');
    } else {
        setApMsg(t('ap_save_failed', tErr(j && j.code)), 'err');
    }
    refreshWifi();
}

function refreshAll() { refreshWifi(); refreshDevices(); }

let refresh_timer = setInterval(refreshAll, 5000);
// 页面不可见时停掉轮询：没人看的时候不必每 5 秒打两次请求（手机长期开着这个页面
// 尤其明显）；切回来立刻刷一次，免得看到的还是离开时的旧数据
document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        clearInterval(refresh_timer);
        refresh_timer = null;
    }
    else if (refresh_timer === null) {
        refreshAll();
        refresh_timer = setInterval(refreshAll, 5000);
    }
});

refreshAll();
</script>
</body>
</html>
